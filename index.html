<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnMax</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Loading Screen Styles - Your Preferred Design */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .geometric-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
        }

        .geo-shape {
            position: absolute;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            border-radius: 8px;
            animation: geoFloat 20s ease-in-out infinite;
        }

        .geo-shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 15%;
            left: 10%;
            animation-delay: 0s;
        }

        .geo-shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 8%;
            animation-delay: -5s;
            border-radius: 20px;
        }

        .geo-shape:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: -10s;
            border-radius: 30px;
        }

        @keyframes geoFloat {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg) scale(1);
                opacity: 0.1;
            }
            33% { 
                transform: translateY(-40px) rotate(90deg) scale(1.1);
                opacity: 0.15;
            }
            66% { 
                transform: translateY(20px) rotate(180deg) scale(0.9);
                opacity: 0.08;
            }
        }

        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: gridMove 40s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }

        .modern-container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 420px;
            width: 90%;
            padding: 40px 0;
        }

        .modern-header {
            margin-bottom: 50px;
        }

        .modern-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            position: relative;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff6b6b, #4ecdc4, #45b7d1, #96e6a1, #ff6b6b);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logoRotate 3s linear infinite;
            position: relative;
        }

        .logo-circle::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            background: #000000;
            border-radius: 50%;
        }

        .logo-icon {
            position: relative;
            z-index: 2;
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        @keyframes logoRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modern-title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a8b1ff 50%, #4ecdc4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .modern-subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .modern-profile {
            margin-bottom: 40px;
            position: relative;
        }

        .modern-avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
        }

        .modern-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c2c54, #40407a);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modern-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modern-user-info {
            margin-bottom: 25px;
        }

        .modern-user-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .modern-user-username {
            font-size: 14px;
            color: #4ecdc4;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .referrer-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin: 0 auto 30px;
            max-width: 320px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .referrer-title {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 15px;
            font-weight: 500;
            text-align: center;
        }

        .referrer-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .referrer-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .referrer-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .referrer-details {
            flex: 1;
            text-align: left;
        }

        .referrer-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .referrer-username {
            font-size: 13px;
            color: #4ecdc4;
            font-weight: 500;
        }

        .referrer-id {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .referral-data {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-label {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            font-weight: 500;
        }

        .data-value {
            font-size: 12px;
            color: #4ecdc4;
            font-weight: 600;
            font-family: monospace;
        }

        .modern-progress {
            margin-bottom: 35px;
        }

        .modern-steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            position: relative;
            padding: 0 15px;
        }

        .modern-steps::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 40px;
            right: 40px;
            height: 2px;
            background: linear-gradient(90deg, 
                rgba(78, 205, 196, 0.3) 0%, 
                rgba(78, 205, 196, 0.6) 50%, 
                rgba(78, 205, 196, 0.3) 100%);
            z-index: 1;
        }

        .modern-step {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }

        .modern-step-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            font-weight: 600;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        .modern-step.active .modern-step-dot {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7d1 100%);
            border-color: rgba(78, 205, 196, 0.5);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.4);
            color: #ffffff;
            transform: scale(1.1);
        }

        .modern-step.completed .modern-step-dot {
            background: linear-gradient(135deg, #96e6a1 0%, #45b7d1 100%);
            border-color: rgba(150, 230, 161, 0.5);
        }

        .modern-step.completed .modern-step-dot::before {
            content: '✓';
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
        }

        .modern-step-text {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 0.2px;
        }

        .modern-step.active .modern-step-text {
            color: #4ecdc4;
            font-weight: 600;
        }

        .modern-step.completed .modern-step-text {
            color: #96e6a1;
        }

        .modern-progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .modern-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
            border-radius: 2px;
            animation: modernProgress 7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        .modern-progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: modernShimmer 2s infinite;
        }

        @keyframes modernProgress {
            0% { width: 0%; }
            20% { width: 25%; }
            40% { width: 50%; }
            60% { width: 75%; }
            80% { width: 90%; }
            100% { width: 100%; }
        }

        @keyframes modernShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        .modern-message-container {
            position: relative;
            min-height: 20px;
            margin-bottom: 8px;
        }

        .modern-message {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .modern-submessage {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-top: 3px;
        }

        .modern-status {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.3px;
        }

        .modern-status-dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: #4ecdc4;
            border-radius: 50%;
            margin-right: 6px;
            animation: modernPulse 1.5s infinite;
        }

        @keyframes modernPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

            max-width: 400px;

            padding: 20px;
            padding-bottom: 80px;

            margin-bottom: 30px;

        }

        .welcome-section h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #FFFFFF 0%, #A8B1FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-section p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .notification-bell {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .notification-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: #FF6B6B;
            border-radius: 50%;
        }

        .balance-card {
            background: linear-gradient(135deg, #7877C6 0%, #4DD0E1 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 15px 30px rgba(120, 119, 198, 0.3);
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 3s infinite;
        }

        .balance-label {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .balance-amount {
            font-size: 36px;

            margin-bottom: 15px;
            font-variant-numeric: tabular-nums;
        }

        .balance-actions {
            display: flex;
            gap: 10px;
        }

        .balance-btn {
            flex: 1;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .balance-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .quick-stats {

        .stat-card {

            padding: 20px 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .stat-icon {
            width: 40px;

            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;

        }

        .stat-value {
            font-size: 18px;

            margin-bottom: 4px;

        }

        .stat-label {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            font-weight: 500;
        }

        .tasks-section {
            margin-bottom: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;

        }

        .see-all {

            color: #4DD0E1;

        .tasks-grid {

        .task-card:hover {

        .task-header {

            border-radius: 3px;

        }
