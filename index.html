<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XO Pro - Loading</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f3ff;
            --primary-dark: #00c4cc;
            --secondary: #ff2d75;
            --accent: #b967ff;
            --success: #00ff88;
            --dark: #0a0a15;
            --darker: #050510;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-secondary: #8892b0;
            --border: #2a2a4a;
            --gradient: linear-gradient(135deg, #00f3ff, #b967ff, #ff2d75);
            --gradient-primary: linear-gradient(135deg, #00f3ff, #00c4cc);
            --gradient-secondary: linear-gradient(135deg, #ff2d75, #ff6b9d);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --glow: 0 0 20px rgba(0, 243, 255, 0.2);
            
            /* রেস্পন্সিভ সাইজ ভেরিয়েবল */
            --container-padding: clamp(15px, 4vw, 30px);
            --box-padding: clamp(20px, 5vw, 25px);
            --font-size-lg: clamp(24px, 6vw, 36px);
            --font-size-md: clamp(16px, 4vw, 20px);
            --font-size-sm: clamp(12px, 3vw, 14px);
            --font-size-xs: clamp(10px, 2.5vw, 12px);
            --avatar-size: clamp(80px, 20vw, 120px);
            --icon-size: clamp(30px, 8vw, 40px);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }

        /* XO থিম ব্যাকগ্রাউন্ড */
        .xo-theme-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 45, 117, 0.1) 0%, transparent 40%),
                linear-gradient(45deg, var(--darker) 0%, #0c0c1c 100%);
            z-index: -2;
        }

        .xo-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: clamp(40px, 10vw, 60px) clamp(40px, 10vw, 60px);
            opacity: 0.1;
            z-index: -1;
        }

        .floating-xo {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            opacity: 0.05;
            animation: floatXO 8s ease-in-out infinite;
            font-size: clamp(30px, 8vw, 80px);
        }

        .floating-xo.x { color: var(--primary); }
        .floating-xo.o { color: var(--secondary); }

        @keyframes floatXO {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5vw, -3vh) rotate(90deg); }
            50% { transform: translate(-3vw, 5vh) rotate(180deg); }
            75% { transform: translate(-5vw, -3vh) rotate(270deg); }
        }

        /* মেইন কন্টেইনার */
        .responsive-container {
            width: 100%;
            max-width: 450px;
            min-width: 280px;
            padding: var(--container-padding);
        }

        /* হেডার সেকশন */
        .responsive-header {
            text-align: center;
            margin-bottom: clamp(30px, 8vw, 50px);
        }

        .xo-logo {
            display: inline-flex;
            align-items: center;
            gap: clamp(10px, 3vw, 15px);
            margin-bottom: clamp(15px, 4vw, 20px);
            padding: clamp(15px, 4vw, 20px) clamp(20px, 5vw, 30px);
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid var(--border);
            border-radius: clamp(15px, 4vw, 20px);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .logo-symbol {
            width: clamp(40px, 10vw, 50px);
            height: clamp(40px, 10vw, 50px);
            background: var(--gradient);
            border-radius: clamp(8px, 2vw, 12px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 900;
            color: white;
            flex-shrink: 0;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: var(--font-size-lg);
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .tagline {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.4;
        }

        /* রেস্পন্সিভ বক্স কম্পোনেন্ট */
        .responsive-box {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: clamp(15px, 4vw, 18px);
            padding: var(--box-padding);
            margin-bottom: clamp(20px, 5vw, 30px);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .responsive-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient);
        }

        /* প্রোফাইল সেকশন */
        .profile-content {
            display: flex;
            align-items: center;
            gap: clamp(15px, 4vw, 20px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .profile-avatar {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 6vw, 36px);
            color: white;
            font-weight: 700;
            border: 3px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-avatar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: avatarShine 3s infinite;
        }

        @keyframes avatarShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .profile-info {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        @media (min-width: 480px) {
            .profile-info {
                text-align: left;
            }
        }

        .profile-name {
            font-size: var(--font-size-md);
            font-weight: 700;
            margin-bottom: clamp(8px, 2vw, 12px);
            color: var(--text);
            line-height: 1.3;
        }

        .profile-username {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        @media (min-width: 480px) {
            .profile-username {
                justify-content: flex-start;
            }
        }

        .telegram-badge {
            background: var(--gradient-secondary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: var(--font-size-xs);
            font-weight: 600;
            color: white;
        }

        /* প্রোগ্রেস সেকশন */
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(12px, 3vw, 18px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-label {
            font-size: var(--font-size-sm);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .progress-percent {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(14px, 4vw, 18px);
            font-weight: 700;
            color: var(--primary);
        }

        .progress-bar {
            width: 100%;
            height: clamp(6px, 2vw, 8px);
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient);
            border-radius: 4px;
            width: 0%;
            transition: width 0.8s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: progressShine 2s infinite;
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* স্ট্যাটাস সেকশন */
        .status-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 3vw, 18px);
            flex-wrap: wrap;
            text-align: center;
        }

        .status-icon {
            width: var(--icon-size);
            height: var(--icon-size);
            background: var(--gradient-primary);
            border-radius: clamp(8px, 2vw, 10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(14px, 4vw, 18px);
            color: white;
            flex-shrink: 0;
        }

        .status-text {
            font-size: var(--font-size-md);
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .status-dots {
            display: flex;
            gap: 3px;
        }

        .status-dot {
            width: clamp(4px, 1.5vw, 5px);
            height: clamp(4px, 1.5vw, 5px);
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.6;
            animation: dotPulse 1.4s ease-in-out infinite both;
        }

        .status-dot:nth-child(2) { animation-delay: 0.2s; }
        .status-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { 
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% { 
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .status-subtext {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-top: clamp(5px, 1.5vw, 8px);
            line-height: 1.4;
            width: 100%;
        }

        /* মিউজিক কন্ট্রোল */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .music-btn {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--glow);
        }

        .music-btn.muted {
            background: var(--text-secondary);
        }

        /* অ্যানিমেশন */
        .fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .delay-1 { animation-delay: 0.2s; opacity: 0; }
        .delay-2 { animation-delay: 0.4s; opacity: 0; }

        /* খুব ছোট ডিভাইসের জন্য অতিরিক্ত স্টাইল */
        @media (max-width: 320px) {
            .xo-logo {
                flex-direction: column;
            }
            
            .music-control {
                bottom: 10px;
                right: 10px;
            }
            
            .music-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        /* ট্যাবলেট এবং ডেস্কটপ */
        @media (min-width: 768px) {
            .responsive-container {
                max-width: 500px;
            }
            
            .profile-content {
                justify-content: flex-start;
            }
            
            .profile-info {
                text-align: left;
            }
        }

        /* ল্যান্ডস্কেপ মোড */
        @media (max-height: 500px) and (orientation: landscape) {
            .responsive-container {
                max-width: 90%;
                padding: 10px;
            }
            
            .responsive-header {
                margin-bottom: 15px;
            }
            
            .responsive-box {
                margin-bottom: 15px;
                padding: 15px;
            }
            
            .profile-content {
                gap: 10px;
            }
            
            .profile-avatar {
                width: 60px;
                height: 60px;
            }
            
            .music-control {
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- XO থিম ব্যাকগ্রাউন্ড -->
    <div class="xo-theme-bg">
        <div class="xo-grid"></div>
        <div class="floating-xo x" style="top: 10%; left: 5%;">X</div>
        <div class="floating-xo o" style="top: 20%; left: 85%;">O</div>
        <div class="floating-xo x" style="top: 75%; left: 10%;">X</div>
        <div class="floating-xo o" style="top: 65%; left: 90%;">O</div>
        <div class="floating-xo x" style="top: 90%; left: 75%;">X</div>
    </div>

    <!-- ব্যাকগ্রাউন্ড মিউজিক -->
    <audio id="backgroundMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-show-suspense-waiting-667.mp3" type="audio/mpeg">
        <source src="https://assets.mixkit.co/music/preview/mixkit-game-show-suspense-waiting-667.wav" type="audio/wav">
    </audio>

    <!-- মিউজিক কন্ট্রোল -->
    <div class="music-control">
        <button class="music-btn" id="musicToggle">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>

    <div class="responsive-container">
        <!-- হেডার সেকশন -->
        <div class="responsive-header fade-in-up">
            <div class="xo-logo">
                <div class="logo-symbol">XO</div>
                <h1 class="logo-text">XO PRO</h1>
            </div>
            <p class="tagline">Ultimate Gaming Experience</p>
        </div>

        <!-- প্রোফাইল বক্স -->
        <div class="responsive-box fade-in-up delay-1">
            <div class="profile-content">
                <div class="profile-avatar">
                    <img id="profilePic" alt="Profile Picture">
                </div>
                <div class="profile-info">
                    <h2 class="profile-name" id="userName">Loading...</h2>
                    <div class="profile-username">
                        <span id="userUsername">@username</span>
                        <div class="telegram-badge">
                            <i class="fab fa-telegram"></i> Telegram
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- প্রোগ্রেস বক্স -->
        <div class="responsive-box fade-in-up delay-1">
            <div class="progress-info">
                <div class="progress-label">Game Loading</div>
                <div class="progress-percent" id="percentage">0%</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- স্ট্যাটাস বক্স -->
        <div class="responsive-box fade-in-up delay-2">
            <div class="status-content">
                <div class="status-icon">
                    <i class="fas fa-rocket"></i>
                </div>
                <div class="status-text">
                    <span id="statusMessage">Initializing Game</span>
                    <span class="status-dots">
                        <span class="status-dot"></span>
                        <span class="status-dot"></span>
                        <span class="status-dot"></span>
                    </span>
                </div>
                <div class="status-subtext" id="statusSubtext">Preparing your ultimate gaming experience</div>
            </div>
        </div>
    </div>

    <script>
        // টেলিগ্রাম ইউজার ডেটা লোড
        function loadTelegramUserData() {
            const tg = window.Telegram?.WebApp;
            
            if (tg && tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                
                // প্রোফাইল পিকচার
                if (user.photo_url) {
                    document.getElementById('profilePic').src = user.photo_url;
                } else {
                    // ডিফল্ট অ্যাভাটার
                    document.getElementById('profilePic').src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%2300f3ff;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23b967ff;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='40' r='20' fill='url(%23grad)'/%3E%3Ccircle cx='50' cy='100' r='30' fill='url(%23grad)'/%3E%3C/svg%3E";
                }
                
                // ইউজার নাম
                let fullName = user.first_name || '';
                if (user.last_name) {
                    fullName += ' ' + user.last_name;
                }
                document.getElementById('userName').textContent = fullName || 'Telegram User';
                
                // ইউজারনেম
                if (user.username) {
                    document.getElementById('userUsername').textContent = '@' + user.username;
                } else {
                    document.getElementById('userUsername').textContent = 'Telegram User';
                }
                
                // টেলিগ্রাম WebApp সেটআপ
                tg.expand();
                tg.BackButton.hide();
                
            } else {
                // ডেমো ডেটা (যদি টেলিগ্রাম থেকে ডেটা না আসে)
                setupDemoData();
            }
        }

        // ডেমো ডেটা সেটআপ
        function setupDemoData() {
            document.getElementById('profilePic').src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%2300f3ff;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23b967ff;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='40' r='20' fill='url(%23grad)'/%3E%3Ccircle cx='50' cy='100' r='30' fill='url(%23grad)'/%3E%3C/svg%3E";
            document.getElementById('userName').textContent = 'আহসান হাবিব';
            document.getElementById('userUsername').textContent = '@ahsan_xo';
        }

        // ব্যাকগ্রাউন্ড মিউজিক কন্ট্রোল
        function setupMusicControl() {
            const music = document.getElementById('backgroundMusic');
            const toggleBtn = document.getElementById('musicToggle');
            const icon = toggleBtn.querySelector('i');
            
            // ভলিউম সেট
            music.volume = 0.3;
            
            // অটোপ্লে করার চেষ্টা করুন
            music.play().catch(error => {
                console.log('Autoplay prevented:', error);
                // ইউজার ইন্টার‍্যাকশনের পর প্লে করবে
                toggleBtn.style.background = 'var(--text-secondary)';
            });
            
            toggleBtn.addEventListener('click', function() {
                if (music.paused) {
                    music.play();
                    icon.className = 'fas fa-volume-up';
                    toggleBtn.classList.remove('muted');
                } else {
                    music.pause();
                    icon.className = 'fas fa-volume-mute';
                    toggleBtn.classList.add('muted');
                }
            });
        }

        // ৮ সেকেন্ড লোডিং সিকোয়েন্স
        function startLoadingSequence() {
            const progressFill = document.getElementById('progressFill');
            const percentage = document.getElementById('percentage');
            const statusMessage = document.getElementById('statusMessage');
            const statusSubtext = document.getElementById('statusSubtext');
            
            const loadingSteps = [
                { progress: 12, message: "Initializing Game", subtext: "Loading core modules" },
                { progress: 25, message: "Loading Assets", subtext: "Loading game resources" },
                { progress: 40, message: "Setting Up AI", subtext: "Preparing smart opponents" },
                { progress: 55, message: "Network Setup", subtext: "Connecting multiplayer services" },
                { progress: 70, message: "Profile Sync", subtext: "Synchronizing user data" },
                { progress: 85, message: "Finalizing", subtext: "Optimizing performance" },
                { progress: 95, message: "Almost Ready", subtext: "Final preparations" },
                { progress: 100, message: "Ready to Play!", subtext: "Game loaded successfully" }
            ];
            
            let currentStep = 0;
            const totalTime = 8000; // ৮ সেকেন্ড
            const stepTime = totalTime / loadingSteps.length;
            
            function updateLoading() {
                if (currentStep < loadingSteps.length) {
                    const step = loadingSteps[currentStep];
                    
                    progressFill.style.width = `${step.progress}%`;
                    percentage.textContent = `${step.progress}%`;
                    statusMessage.textContent = step.message;
                    statusSubtext.textContent = step.subtext;
                    
                    currentStep++;
                    setTimeout(updateLoading, stepTime);
                } else {
                    // লোডিং সম্পূর্ণ
                    setTimeout(() => {
                        console.log("XO Pro loaded successfully with background music!");
                        // এখানে মূল গেম পেজে রিডাইরেক্ট করবেন
                        // window.location.href = "game.html";
                    }, 1000);
                }
            }
            
            // শুরু করুন
            setTimeout(updateLoading, 500);
        }

        // DOM লোড হওয়ার পর
        document.addEventListener('DOMContentLoaded', function() {
            loadTelegramUserData();
            setupMusicControl();
            setTimeout(startLoadingSequence, 1000);
            
            // ভিউপোর্ট হাইট ইস্যু ফিক্স
            function setViewportHeight() {
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', `${vh}px`);
            }
            
            setViewportHeight();
            window.addEventListener('resize', setViewportHeight);
            window.addEventListener('orientationchange', setViewportHeight);
        });
    </script>
</body>
</html>
