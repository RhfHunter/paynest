<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Earning Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0F0F1A;
            color: #FFFFFF;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Professional Loading Screen */
        .pro-loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0F0F1A 0%, #1A1A2E 50%, #16213E 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow: hidden;
        }

        /* Animated Background Elements */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            opacity: 0.08;
            filter: blur(50px);
            animation: float 12s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 400px;
            height: 400px;
            top: 5%;
            left: 5%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 300px;
            height: 300px;
            top: 65%;
            right: 8%;
            animation-delay: -4s;
            background: linear-gradient(45deg, #45B7D1, #96E6A1);
        }

        .shape:nth-child(3) {
            width: 350px;
            height: 350px;
            bottom: 15%;
            left: 15%;
            animation-delay: -8s;
            background: linear-gradient(45deg, #FCE38A, #F38181);
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            33% { 
                transform: translateY(-40px) rotate(120deg) scale(1.1);
            }
            66% { 
                transform: translateY(20px) rotate(240deg) scale(0.9);
            }
        }

        /* Connection Lines */
        .connection-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.3), transparent);
            height: 1px;
            animation: lineFlow 6s linear infinite;
        }

        .line:nth-child(1) {
            top: 30%;
            left: -100px;
            width: 200px;
            animation-delay: 0s;
        }

        .line:nth-child(2) {
            top: 60%;
            right: -100px;
            width: 180px;
            animation-delay: -2s;
        }

        .line:nth-child(3) {
            bottom: 40%;
            left: -120px;
            width: 220px;
            animation-delay: -4s;
        }

        @keyframes lineFlow {
            0% { transform: translateX(-100px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(calc(100vw + 100px)); opacity: 0; }
        }

        /* Main Content Container */
        .pro-container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 420px;
            width: 90%;
            padding: 40px 0;
        }

        /* Profile Section - Enhanced */
        .pro-profile {
            margin-bottom: 50px;
            position: relative;
        }

        .pro-avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
        }

        .pro-avatar-glow {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #4ECDC4 100%);
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.6;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .pro-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.15);
            padding: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .pro-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1A1A2E;
        }

        .pro-user-info {
            margin-bottom: 15px;
        }

        .pro-user-name {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #FFFFFF;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .pro-user-username {
            font-size: 16px;
            color: #A8B1FF;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Progress Section - Enhanced */
        .pro-progress-section {
            margin-bottom: 40px;
        }

        .pro-steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
            padding: 0 20px;
        }

        .pro-steps::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50px;
            right: 50px;
            height: 3px;
            background: linear-gradient(90deg, 
                rgba(102, 126, 234, 0.3) 0%, 
                rgba(102, 126, 234, 0.6) 50%, 
                rgba(102, 126, 234, 0.3) 100%);
            z-index: 1;
            border-radius: 2px;
        }

        .pro-step {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }

        .pro-step-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            font-weight: 600;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
        }

        .pro-step.active .pro-step-dot {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.6);
            color: #FFFFFF;
            transform: scale(1.1);
        }

        .pro-step.completed .pro-step-dot {
            background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
            border-color: rgba(78, 205, 196, 0.5);
            box-shadow: 0 0 25px rgba(78, 205, 196, 0.4);
        }

        .pro-step.completed .pro-step-dot::before {
            content: '✓';
            color: #FFFFFF;
            font-weight: bold;
            font-size: 16px;
        }

        .pro-step-text {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
        }

        .pro-step.active .pro-step-text {
            color: #A8B1FF;
            font-weight: 600;
        }

        .pro-step.completed .pro-step-text {
            color: #4ECDC4;
        }

        /* Progress Bar - Enhanced */
        .pro-progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .pro-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea, #764ba2, #4ECDC4);
            border-radius: 4px;
            animation: pro-progress 8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        .pro-progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: pro-shimmer 2.5s infinite;
        }

        @keyframes pro-progress {
            0% { width: 0%; }
            20% { width: 25%; }
            40% { width: 50%; }
            60% { width: 75%; }
            80% { width: 90%; }
            100% { width: 100%; }
        }

        @keyframes pro-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        /* Loading Message - Enhanced */
        .pro-message-container {
            position: relative;
            min-height: 24px;
            margin-bottom: 10px;
        }

        .pro-message {
            font-size: 15px;
            color: rgba(255,255,255,0.8);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .pro-submessage {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }

        /* Status Bar - Enhanced */
        .pro-status {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #4ECDC4;
            border-radius: 50%;
            margin-right: 8px;
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Main App (Hidden Initially) */
        .main-app {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Professional Loading Screen -->
    <div class="pro-loading-screen" id="loadingScreen">
        <div class="bg-grid"></div>
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        <div class="connection-lines">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
        
        <div class="pro-container">
            <!-- Profile - Enhanced -->
            <div class="pro-profile">
                <div class="pro-avatar-container">
                    <div class="pro-avatar-glow"></div>
                    <div class="pro-avatar">
                        <img id="profilePic" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="Profile">
                    </div>
                </div>
                <div class="pro-user-info">
                    <div class="pro-user-name" id="userName">Initializing...</div>
                    <div class="pro-user-username" id="userUsername">@username</div>
                </div>
            </div>
            
            <!-- Progress - Enhanced -->
            <div class="pro-progress-section">
                <div class="pro-steps">
                    <div class="pro-step active" id="step1">
                        <div class="pro-step-dot">1</div>
                        <div class="pro-step-text">Authentication</div>
                    </div>
                    <div class="pro-step" id="step2">
                        <div class="pro-step-dot">2</div>
                        <div class="pro-step-text">Data Sync</div>
                    </div>
                    <div class="pro-step" id="step3">
                        <div class="pro-step-dot">3</div>
                        <div class="pro-step-text">Tasks Ready</div>
                    </div>
                    <div class="pro-step" id="step4">
                        <div class="pro-step-dot">4</div>
                        <div class="pro-step-text">Complete</div>
                    </div>
                </div>
                
                <div class="pro-progress-container">
                    <div class="pro-progress-bar"></div>
                </div>
                
                <div class="pro-message-container">
                    <div class="pro-message" id="loadingMessage">
                        Initializing your earning dashboard...
                    </div>
                    <div class="pro-submessage" id="subMessage">
                        Securing your connection
                    </div>
                </div>
            </div>
        </div>
        
        <div class="pro-status">
            <span class="status-dot"></span>
            Secured Connection • v2.1.4 • Premium
        </div>
    </div>

    <!-- Main App Content -->
    <div class="main-app" id="mainApp">
        <!-- Your main app content here -->
    </div>

    <script>
        // Telegram Web App Initialization
        const tg = window.Telegram.WebApp;
        
        let currentStep = 1;
        const subMessages = [
            "Verifying your identity...",
            "Loading your balance...",
            "Preparing earning tasks...",
            "Optimizing performance...",
            "Almost ready..."
        ];
        
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });
        
        function initializeApp() {
            tg.expand();
            tg.enableClosingConfirmation();
            
            // Start loading sequence
            startLoadingSequence();
        }
        
        function startLoadingSequence() {
            // Step 1: User Authentication
            updateStep(1, 'Authenticating your account', subMessages[0]);
            
            setTimeout(() => {
                // Set user info from Telegram
                const user = tg.initDataUnsafe.user;
                if (user) {
                    document.getElementById('userName').textContent = user.first_name || 'User';
                    document.getElementById('userUsername').textContent = user.username ? '@' + user.username : '@user';
                    
                    if (user.photo_url) {
                        document.getElementById('profilePic').src = user.photo_url;
                    }
                }
                
                // Step 2: Data Sync
                updateStep(2, 'Synchronizing your data', subMessages[1]);
                
                setTimeout(() => {
                    // Step 3: Tasks Preparation
                    updateStep(3, 'Preparing earning tasks', subMessages[2]);
                    
                    setTimeout(() => {
                        // Step 4: Complete
                        updateStep(4, 'Finalizing setup', subMessages[3]);
                        
                        setTimeout(() => {
                            updateSubMessage(subMessages[4]);
                            setTimeout(() => {
                                completeLoading();
                            }, 1000);
                        }, 1500);
                    }, 2000);
                }, 2000);
            }, 1500);
        }
        
        function updateStep(step, message, subMessage) {
            // Update current step
            currentStep = step;
            
            // Update all steps
            for (let i = 1; i <= 4; i++) {
                const stepElement = document.getElementById('step' + i);
                if (i < step) {
                    stepElement.classList.add('completed');
                    stepElement.classList.remove('active');
                } else if (i === step) {
                    stepElement.classList.add('active');
                    stepElement.classList.remove('completed');
                } else {
                    stepElement.classList.remove('active', 'completed');
                }
            }
            
            // Update messages
            document.getElementById('loadingMessage').textContent = message;
            if (subMessage) {
                updateSubMessage(subMessage);
            }
        }
        
        function updateSubMessage(message) {
            document.getElementById('subMessage').textContent = message;
        }
        
        function completeLoading() {
            // Add completion animation
            const loadingScreen = document.getElementById('loadingScreen');
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transform = 'scale(0.95)';
            loadingScreen.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                
                // Initialize main app
                tg.ready();
            }, 600);
        }
        
        // Handle errors gracefully
        window.addEventListener('error', function(e) {
            console.error('Loading error:', e);
            updateSubMessage('Optimizing your experience...');
        });
    </script>
</body>
    </html>
